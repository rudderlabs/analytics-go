sonar.projectKey=rudderlabs_analytics-go
sonar.organization=rudderlabs
sonar.projectName=analytics-go
sonar.qualitygate.wait=false

sonar.links.scm=https://github.com/rudderlabs/analytics-go
sonar.links.issue=https://github.com/rudderlabs/analytics-go/issues

# Sources and tests
sonar.sources=.
sonar.exclusions=**/*_test.go,fixtures/**,example/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage profile from the Go tests
sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
