version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "rudderlabs/*"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "github.com/rudderlabs/*"
    groups:
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
      go-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-deps-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
