name: Server SDK E2E

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

# Central live runs own cleanup and are never cancelled by a newer PR update.
# A stale candidate fails the shared freshness check; the updated PR gets a new run.
jobs:
  go-sdk-candidate-gate:
    name: Go SDK candidate gate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # Do not check out or execute PR code in this credential-bearing job.
      - name: Create a central validation token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: rudder-sdk-e2e-tests
          permission-actions: write
      - name: Validate the candidate through the shared harness
        uses: rudderlabs/github-action-sdk-e2e@41aa09c2a759ba0ba9d76f974195ca7e8aa46329 # SDK-6013; merge dependency before this caller.
        with:
          token: ${{ steps.token.outputs.token }}
          suite: full
