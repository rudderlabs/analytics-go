name: Server SDK E2E

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: reliability is local delivery; full also uses a live CI pipeline
        type: choice
        options: [reliability, full]
        default: reliability
  release:
    types: [published]

permissions:
  contents: read

# Independent requests must not cancel earlier merge or release validations.
jobs:
  validate:
    # Fork PRs cannot access the dispatch App secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Create a central validation token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Match the working release App configuration in release-please.yaml.
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: rudder-sdk-e2e-tests
          permission-actions: write
      - name: Detect this repository, dispatch, and wait for its result
        uses: rudderlabs/github-action-sdk-e2e@cfb61420aa6b54c914028d24c46693015c9b78dc
        with:
          token: ${{ steps.token.outputs.token }}
          suite: ${{ inputs.suite || vars.SDK_E2E_SUITE || 'reliability' }}
