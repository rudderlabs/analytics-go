name: Code Quality Checks
on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
    types: ['opened', 'reopened', 'synchronize', 'edited']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ${{ github.event_name == 'push' && fromJSON('["go.mod"]') || fromJSON('["1.19", "go.mod", "stable"]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout source code
        with:
          fetch-depth: ${{ matrix.go == 'go.mod' && '0' || '1' }} # SonarCloud uses the full Git history
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go ${{ matrix.go }}
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && matrix.go || '' }}

      - name: Build Go
        run: go build -v ./...

      # Coverage of the SDK package only: Go 1.22+ also lists packages without tests (cmd/cli, example) at 0%,
      # which would make the totals differ between matrix versions.
      - name: Test Go
        run: go test -race -covermode=atomic -coverpkg=github.com/rudderlabs/analytics-go/v4 -coverprofile=coverage.out ./... -v

      - name: Report coverage
        env:
          GO_MATRIX: ${{ matrix.go }}
        run: |
          go tool cover -func=coverage.out > coverage-func.txt
          total="$(tail -n 1 coverage-func.txt)"
          echo "$total"
          echo "Go $GO_MATRIX SDK package coverage: \`$total\`" >> "$GITHUB_STEP_SUMMARY"

      # Advisory: an artifact service problem must not fail a required build check after the tests passed.
      - name: Upload coverage report
        if: ${{ matrix.go == 'go.mod' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out

      # Fork PRs do not receive SONAR_TOKEN. Keep scan failures advisory.
      - name: SonarQube Scan
        if: >-
          matrix.go == 'go.mod' &&
          github.event.action != 'edited' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
