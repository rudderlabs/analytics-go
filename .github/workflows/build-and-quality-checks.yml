name: Code Quality Checks
on:
  pull_request:
    branches: ['master']
    types: ['opened', 'reopened', 'synchronize', 'edited']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.19', 'go.mod', 'stable' ]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout source code

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go ${{ matrix.go }}
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && matrix.go || '' }}

      - name: Build Go
        run: go build -v ./...

      - name: Test Go
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./... -v

      - name: Report coverage
        env:
          GO_MATRIX: ${{ matrix.go }}
        run: |
          total="$(go tool cover -func=coverage.out | tail -1)"
          echo "$total"
          echo "Go $GO_MATRIX unit test coverage: \`$total\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ matrix.go == 'go.mod' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out
